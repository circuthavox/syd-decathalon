<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#233041">
<meta name="description" content="The Sydney Decathlon card deck">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>The Sydney Decathlon</title>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><img class="brand-logo" src="sydney-decathlon-logo.png" alt=""><span>THE SYDNEY <b>DECATHLON</b></span></a>
  <div class="top-actions"><button id="missionBtn" class="mission-btn">Mission Board ↗</button><button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button></div>
</header>
<main>
  <section class="deck-panel">
    <div class="stats">
      <div><span class="stat-label">DRAW PILE</span><strong id="deckCount">50</strong></div>
      <div><span class="stat-label">HAND</span><strong id="handCount">0 / 3</strong></div>
      <div><span class="stat-label">DISCARD</span><strong id="discardCount">0</strong></div>
    </div>
    <div class="draw-row">
      <div class="deck-wrap">
        <div class="deck-stack" id="deckStack"><img src="card-back.png" alt="Sydney Decathlon card back"><span class="deck-count" id="stackCount">50</span></div>
      </div>
      <button id="drawBtn" class="draw-btn">DRAW CARD <span>→</span></button>
    </div>
    <div class="last-draw" id="lastDraw"><span>READY TO DRAW</span></div>
  </section>
  <section class="panel">
    <div class="section-heading"><h2>Active curses <span class="count-pill" id="curseCount">0</span></h2></div>
    <div id="activeCurses" class="empty-state">No active curses.</div>
  </section>
  <section class="panel">
    <div class="section-heading"><h2>Blessing hand <span class="count-pill" id="handPill">0</span></h2><span class="subtle" id="handLimitLabel">3 card limit</span></div>
    <div id="handCards" class="hand-grid"><div class="empty-state">No blessings in your hand.</div></div>
  </section>
  <section class="panel">
    <div class="section-heading"><h2>Discard pile <span class="count-pill" id="discardPill">0</span></h2><button class="text-btn" id="viewDiscard">VIEW</button></div>
    <div id="discardList" class="discard-list hidden"></div>
  </section>
  <footer><button id="resetBtn">Reset game</button></footer>
</main>
<div class="overlay hidden" id="revealOverlay"><div class="reveal-modal"><button class="close" id="closeReveal" aria-label="Close">×</button><div class="reveal-flip" id="revealFlip"><div class="reveal-back"><img src="card-back.png" alt=""></div><div class="reveal-front" id="revealFront"></div></div><div class="reveal-status" id="revealStatus"></div><div class="reveal-actions" id="revealActions"></div></div></div>
<div class="overlay hidden" id="overflowOverlay"><div class="dialog"><button class="close" id="closeOverflow">×</button><h2>Hand is full</h2><p>Choose a card to discard, or discard the new card.</p><div id="overflowChoices"></div></div></div>
<div class="overlay hidden" id="settingsOverlay"><div class="dialog"><button class="close" id="closeSettings">×</button><h2>Settings</h2><label for="missionUrl">Mission Board URL</label><input id="missionUrl" type="url" placeholder="https://example.com"><button id="saveSettings" class="draw-btn full">SAVE</button></div></div>
<div class="toast" id="toast"></div>
<script src="cards.js"></script><script src="app.js"></script>
</body></html>
